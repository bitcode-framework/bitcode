version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_platform_widgets: ^7.0.0
  cupertino_icons: ^1.0.8
  freezed_annotation: ^2.4.4
