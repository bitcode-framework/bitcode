name: bc_ui_flutter_example
description: Demo app showcasing @bitcode/ui Flutter adapter components.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_platform_widgets: ^7.0.0
  cupertino_icons: ^1.0.8
  # Path dependency to the parent library.
  bc_ui_flutter:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
